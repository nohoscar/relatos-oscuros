<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08060a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Historias de terror narradas con voces del más allá">
  <title>Relatos Oscuros</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="images/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash" class="splash">
    <div class="splash-content">
      <div class="splash-candle">🕯️</div>
      <h1 class="splash-title">Relatos Oscuros</h1>
      <p class="splash-sub">Donde las sombras tienen voz</p>
      <p class="splash-hint">🎧 Se recomienda usar audífonos</p>
      <button id="btn-enter" class="btn-enter" onclick="enterApp()">Entrar</button>
      <a class="splash-tiktok" href="https://www.tiktok.com/@relatos_de_la_oscuridad" target="_blank" rel="noopener noreferrer">Síguenos en TikTok · @relatos_de_la_oscuridad</a>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="app hidden">
    <!-- Sidebar / Story List -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">🕯️</span>
          <div>
            <h1>Relatos Oscuros</h1>
            <p class="tagline">Donde las sombras tienen voz</p>
          </div>
        </div>
        <div class="header-actions">
          <a class="btn-social" href="https://www.tiktok.com/@relatos_de_la_oscuridad" target="_blank" rel="noopener noreferrer" title="Síguenos en TikTok" aria-label="Síguenos en TikTok">
            <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="currentColor" d="M16.6 5.82A4.28 4.28 0 0 1 15.54 3h-3.09v12.4a2.59 2.59 0 1 1-2.59-2.59c.27 0 .53.04.78.12V9.79a5.67 5.67 0 0 0-.78-.05 5.7 5.7 0 1 0 5.7 5.7V9.01a7.35 7.35 0 0 0 4.3 1.38V7.3a4.29 4.29 0 0 1-3.26-1.48z"/></svg>
          </a>
          <button id="btn-ambient-toggle" class="btn-ambient" onclick="toggleAmbient()" title="Sonido ambiente">🔊</button>
        </div>
      </div>
      <div class="search-box">
        <input id="story-search" type="search" placeholder="Buscar relato..." autocomplete="off" aria-label="Buscar relato" />
      </div>
      <div id="stories-list" class="stories-list"></div>
      <div class="sidebar-footer">
        <button id="btn-offline" class="btn-offline" onclick="toggleOfflineDownload()">⬇ Descargar para escuchar sin conexión</button>
        <div id="offline-status" class="offline-status"></div>
      </div>
    </aside>

    <!-- Main Content / Reader -->
    <main id="reader" class="reader">
      <div id="reader-empty" class="reader-empty">
        <div class="empty-icon">📖</div>
        <p>Selecciona un relato para comenzar</p>
      </div>
      <div id="reader-content" class="reader-content hidden"></div>
    </main>

    <!-- Player -->
    <div id="player" class="player hidden">
      <div class="player-progress-top">
        <div id="progress-bar" class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>
      <div class="player-inner">
        <div class="player-info">
          <span id="player-title" class="player-title"></span>
          <span id="player-fragment" class="player-fragment"></span>
        </div>
        <div class="player-controls">
          <button id="btn-speed" class="btn-ctrl btn-speed" title="Velocidad">1x</button>
          <button id="btn-prev" class="btn-ctrl" title="Anterior">⏮</button>
          <button id="btn-play" class="btn-ctrl btn-play-main" title="Reproducir">▶</button>
          <button id="btn-next" class="btn-ctrl" title="Siguiente">⏭</button>
          <div class="volume-control">
            <button id="btn-volume" class="btn-ctrl" title="Volumen">🔊</button>
            <input id="volume-slider" class="volume-slider" type="range" min="0" max="1" step="0.05" value="1" title="Volumen de la narración" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
